steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8081"
      - --cpu
      - "1"
      - --memory
      - 256Mi
      - --min-instances
      - "0"
      - --max-instances
      - "1"
      - --update-env-vars
      - ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}
      - --set-secrets
      - DATABASE_URL=${_DATABASE_SECRET}:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA

substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: room-finder
  _SERVICE_NAME: room-finder-api
  _DATABASE_SECRET: room-finder-database-url
  _ALLOWED_ORIGINS: ""
