name: Migrate Production Database

on:
  workflow_dispatch:

concurrency:
  group: production-database-migration
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    name: Apply Atlas migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Load database URL from Secret Manager
        run: |
          printf 'PROD_DATABASE_URL=%s\n' "$(gcloud secrets versions access latest \
            --secret="${{ vars.DATABASE_SECRET_NAME }}" \
            --project="${{ vars.GCP_PROJECT_ID }}")" >> "$GITHUB_ENV"

      - name: Set up Atlas
        uses: ariga/setup-atlas@v0

      - name: Validate migration directory
        working-directory: sql
        run: atlas migrate validate --dir "file://migrations"

      - name: Apply pending migrations
        working-directory: sql
        run: atlas migrate apply --env prod
